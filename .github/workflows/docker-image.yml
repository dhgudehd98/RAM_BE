name : Docker Image CI

on:
  # PR이 develop에 merge 되었을 때만 실행
  pull_request_target:
    branches:
      - main
    types:
      - closed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Grant Permission for gradlew & Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test
        working-directory: ./Ram

      - name: Docker build & publish to docker repo
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
          -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ vars.APP_NAME }}:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ vars.APP_NAME }}:latest
        working-directory: ./Ram

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: AWS EC2 SSH & Blue-Green Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ec2-user
          key: ${{ secrets.AWS_SSH_KEY }}
          port: 22
          script: |
            set -e
            
            cd /home/ec2-user/deploy
            
            echo ${{ secrets.DOCKER_PASSWORD }} | sudo docker login \
            -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
            
            sudo docker compose pull app
            
            sudo docker compose up -d
            
            # Blue-Green 배포 스크립트 실행 추후 실행
            # chmod +x ./deploy.sh
            # ./deploy.sh ${{ secrets.DOCKER_USERNAME }}

