version: "3.9"

services:
  # =====================
  # Spring Backend
  # =====================
  app:
    image: pangmin0923/ram:latest  # CI에서 만든 Spring 이미지
    container_name: ram-app
    expose:
      - "8080"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - redis-master
      - redis-slave
      - redis-sentinel-1
      - redis-sentinel-2
      - redis-sentinel-3
    networks:
      - redis-net

  # ======================
  # Redis Master
  # ======================
  redis-master:
    image: redis:7.2
    container_name: redis-master
    ports:
      - "6379:6379"
    volumes:
      - ./master/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    restart: unless-stopped
    networks:
      - redis-net
  # =====================
  # Redis Slave
  # =====================
  redis-slave:
    image: redis:7.2
    container_name: redis-slave
    depends_on:
      - redis-master
    ports:
      - "6380:6380"
    volumes:
      - ./slave/redis.conf:/usr/local/etc/redis/redis.conf
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    restart: unless-stopped
    networks:
      - redis-net

  # =========================
  # Redis Sentinel
  # =========================
  redis-sentinel-1:
    image: redis:7.2
    container_name: redis-sentinel-1
    depends_on:
      - redis-master
      - redis-slave
    ports:
      - "26379:26379"
    volumes:
      - ./sentinel/sentinel-1.conf:/usr/local/etc/redis/sentinel.conf
    command: [ "redis-sentinel", "/usr/local/etc/redis/sentinel.conf" ]
    restart: unless-stopped
    networks:
      - redis-net

  redis-sentinel-2:
    image: redis:7.2
    container_name: redis-sentinel-2
    depends_on:
      - redis-master
      - redis-slave
    ports:
      - "26380:26379"
    volumes:
      - ./sentinel/sentinel-2.conf:/usr/local/etc/redis/sentinel.conf
    command: [ "redis-sentinel", "/usr/local/etc/redis/sentinel.conf" ]
    restart: unless-stopped
    networks:
      - redis-net

  redis-sentinel-3:
    image: redis:7.2
    container_name: redis-sentinel-3
    depends_on:
      - redis-master
      - redis-slave
    ports:
      - "26381:26379"
    volumes:
      - ./sentinel/sentinel-3.conf:/usr/local/etc/redis/sentinel.conf
    command: [ "redis-sentinel", "/usr/local/etc/redis/sentinel.conf" ]
    restart: unless-stopped
    networks:
      - redis-net

networks:
  redis-net:
    driver: bridge