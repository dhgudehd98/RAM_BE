<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>검색 결과</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f7f7f5;
            --surface: #ffffff;
            --border: #e8e8e4;
            --accent: #111111;
            --accent2: #ff3b30;
            --text: #111111;
            --muted: #999990;
            --tag-bg: #f0f0ec;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
        }

        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(247, 247, 245, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }

        .nav-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.6rem;
            letter-spacing: 0.08em;
            color: var(--text);
            text-decoration: none;
        }

        .nav-logo span { color: var(--accent2); }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 9px 18px;
            color: var(--muted);
            font-family: 'Outfit', sans-serif;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .nav-link:hover { border-color: var(--accent); color: var(--text); }

        main {
            max-width: 1280px;
            margin: 0 auto;
            padding: 52px 48px;
        }

        .page-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 2px solid var(--accent);
            animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .page-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.5rem, 4vw, 3.5rem);
            letter-spacing: 0.06em;
            color: var(--text);
            line-height: 1;
        }

        .page-title span { color: var(--accent2); }

        .result-meta {
            font-size: 0.88rem;
            color: var(--muted);
            margin-top: 6px;
        }

        .result-meta strong {
            color: var(--text);
            font-weight: 600;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 9px 18px;
            color: var(--muted);
            font-family: 'Outfit', sans-serif;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .back-btn:hover { border-color: var(--accent); color: var(--text); }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
        }

        .product-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            text-decoration: none;
            display: block;
            animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
        }

        .product-card:nth-child(1) { animation-delay: 0.04s; }
        .product-card:nth-child(2) { animation-delay: 0.08s; }
        .product-card:nth-child(3) { animation-delay: 0.12s; }
        .product-card:nth-child(4) { animation-delay: 0.16s; }
        .product-card:nth-child(5) { animation-delay: 0.20s; }
        .product-card:nth-child(6) { animation-delay: 0.24s; }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 36px rgba(0,0,0,0.09);
            border-color: #ccc;
        }

        .card-image-wrap {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: var(--tag-bg);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .product-card:hover .card-image { transform: scale(1.04); }

        .card-image-placeholder { font-size: 2.5rem; color: var(--muted); }

        .card-body {
            padding: 16px 18px 18px;
            border-top: 1px solid var(--border);
        }

        .card-brand {
            font-size: 0.72rem;
            color: var(--accent2);
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .card-name {
            font-size: 0.95rem;
            color: var(--text);
            font-weight: 500;
            margin-bottom: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-price {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.15rem;
            letter-spacing: 0.04em;
            color: var(--text);
        }

        .card-arrow {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--tag-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            transition: background 0.2s, color 0.2s;
        }

        .product-card:hover .card-arrow { background: var(--accent); color: #fff; }

        .empty {
            text-align: center;
            padding: 100px 0;
            color: var(--muted);
        }

        .empty-icon { font-size: 3rem; margin-bottom: 16px; }
        .empty-keyword {
            font-size: 1.1rem;
            color: var(--text);
            font-weight: 600;
            margin-bottom: 8px;
        }
        .empty p { font-size: 0.95rem; }

        .status-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        .status-badge.pending  { background: rgba(245,158,11,0.15);  color: #f59e0b; }
        .status-badge.progress { background: rgba(16,185,129,0.15);  color: #10b981; }
        .status-badge.closed   { background: rgba(107,114,128,0.15); color: #6b7280; }
    </style>
</head>
<body>

<nav>
    <a href="/" class="nav-logo">MARKET<span>.</span></a>
    <div class="nav-right">
        <a href="/search" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            검색하기
        </a>
        <a href="/product/list" class="nav-link">전체 상품</a>
    </div>
</nav>

<main>
    <div class="page-header">
        <div>
            <h1 class="page-title">SEARCH<span>.</span></h1>
            <p class="result-meta">
                "<strong th:text="${keyword}"></strong>" 검색 결과
                &nbsp;·&nbsp;
                <strong th:text="${#lists.size(products)}"></strong>개
            </p>
        </div>
        <a href="/search" class="back-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
            </svg>
            돌아가기
        </a>
    </div>

    <div class="product-grid" th:if="${not #lists.isEmpty(products)}">
        <a th:each="product : ${products}"
           th:href="@{/product/{id}(id=${product.id})}"
           class="product-card">
            <div class="card-image-wrap">
                <img th:if="${product.imageUrl != null}"
                     th:src="${product.imageUrl}"
                     th:alt="${product.name}"
                     class="card-image"
                     referrerpolicy="no-referrer"
                     onerror="this.style.display='none'">
                <div th:unless="${product.imageUrl != null}" class="card-image-placeholder">📦</div>

                <span th:if="${product.auctionStatus != null and product.auctionStatus.toString() == 'PROGRESS'}" class="status-badge progress">경매 진행중</span>
                <span th:if="${product.auctionStatus != null and product.auctionStatus.toString() == 'PENDING'}" class="status-badge pending">경매 예정</span>
                <span th:if="${product.auctionStatus != null and product.auctionStatus.toString() == 'CLOSED'}" class="status-badge closed">경매 마감</span>
            </div>
            <div class="card-body">
                <div class="card-brand" th:text="${product.brand}"></div>
                <div class="card-name" th:text="${product.name}"></div>

<!--                <span th:if="${product.auctionStatus != null}"-->
<!--                      th:text="${product.auctionStatus.toString() == 'PROGRESS' ? '경매중' : (product.auctionStatus.toString() == 'PENDING' ? '경매예정' : '경매마감')}"-->
<!--                      class="auction-badge">-->
<!--                </span>-->

                <div class="card-footer">
                    <span class="card-price" th:text="${#numbers.formatInteger(product.price, 3, 'COMMA') + '원'}"></span>
                    <div class="card-arrow">
                        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none"
                             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
                        </svg>
                    </div>
                </div>
            </div>
        </a>
    </div>

    <div class="empty" th:if="${#lists.isEmpty(products)}">
        <div class="empty-icon">🔍</div>
        <p class="empty-keyword" th:text="'&quot;' + ${keyword} + '&quot;'"></p>
        <p>검색 결과가 없어요</p>
    </div>
</main>

</body>
</html>
