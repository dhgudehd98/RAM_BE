<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f7f7f5;
            --surface: #ffffff;
            --border: #e8e8e4;
            --accent: #111111;
            --accent2: #ff3b30;
            --text: #111111;
            --muted: #999990;
            --tag-bg: #f0f0ec;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
        }

        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(247, 247, 245, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }

        .nav-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.6rem;
            letter-spacing: 0.08em;
            color: var(--text);
            text-decoration: none;
        }

        .nav-logo span { color: var(--accent2); }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 9px 18px;
            color: var(--muted);
            font-family: 'Outfit', sans-serif;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .nav-link:hover { border-color: var(--accent); color: var(--text); }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 64px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 200px;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .search-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.5rem, 6vw, 4rem);
            letter-spacing: 0.06em;
            color: var(--text);
            text-align: center;
            animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
        }

        .search-title span { color: var(--accent2); }

        /* 검색창 */
        .search-wrapper {
            position: relative;
            width: 100%;
            animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) 0.05s both;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 6px 6px 6px 20px;
            gap: 12px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(17,17,17,0.06), 0 8px 24px rgba(0,0,0,0.06);
        }

        .search-icon {
            flex-shrink: 0;
            color: var(--muted);
            transition: color 0.2s;
        }

        .search-box:focus-within .search-icon { color: var(--accent); }

        #searchInput {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 400;
            color: var(--text);
            caret-color: var(--accent);
            padding: 10px 0;
        }

        #searchInput::placeholder { color: var(--muted); }

        .search-btn {
            flex-shrink: 0;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.06em;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .search-btn:hover { background: #333; }
        .search-btn:active { transform: scale(0.97); }

        /* 자동완성 */
        .autocomplete-list {
            position: absolute;
            top: calc(100% + 8px);
            left: 0; right: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 36px rgba(0,0,0,0.08);
            z-index: 100;
            display: none;
            animation: dropIn 0.15s cubic-bezier(0.16,1,0.3,1) both;
        }

        .autocomplete-list.open { display: block; }

        @keyframes dropIn {
            from { opacity: 0; transform: translateY(-4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .autocomplete-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            cursor: pointer;
            transition: background 0.1s;
            border-bottom: 1px solid var(--border);
        }

        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:hover, .autocomplete-item.active { background: var(--tag-bg); }

        .brand-image {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            object-fit: cover;
            background: var(--tag-bg);
            flex-shrink: 0;
        }

        .brand-image-placeholder {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: var(--tag-bg);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 0.75rem;
            font-weight: 600;
        }

        .autocomplete-item .item-text {
            flex: 1;
            font-size: 0.9rem;
            color: var(--text);
        }

        .autocomplete-item .item-text em {
            font-style: normal;
            color: var(--accent2);
            font-weight: 600;
        }

        .item-label {
            font-size: 0.72rem;
            color: var(--muted);
            background: var(--tag-bg);
            padding: 3px 8px;
            border-radius: 6px;
        }

        .hint {
            font-size: 0.78rem;
            color: var(--muted);
            letter-spacing: 0.01em;
            animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) 0.1s both;
        }

        /* 인기 검색어 */
        .ranking-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) 0.15s both;
        }

        .ranking-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 4px 14px;
        }

        .ranking-header .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent2);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .ranking-header span {
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
        }

        .ranking-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-auto-flow: column;
            grid-template-rows: repeat(5, auto);
            gap: 8px;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--tag-bg);
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .ranking-item:hover { background: var(--border); }

        .rank-num {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1rem;
            color: var(--text);
            width: 20px;
            flex-shrink: 0;
        }

        .rank-name {
            flex: 1;
            font-size: 0.88rem;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rank-new {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--accent2);
            flex-shrink: 0;
        }

        .rank-dash {
            font-size: 0.75rem;
            color: var(--muted);
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<nav>
    <a href="/" class="nav-logo">MARKET<span>.</span></a>
    <div class="nav-right">
        <a href="/product/list" class="nav-link">전체 상품</a>
        <a href="/auction/list" class="nav-link">경매</a>
    </div>
</nav>

<main>
    <div class="search-wrapper">
        <div class="search-box">
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                 fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            <input type="text" id="searchInput" placeholder="상품명 / 브랜드명 검색" autocomplete="off" />
            <button class="search-btn" onclick="doSearch()">검색</button>
        </div>
        <ul class="autocomplete-list" id="autocompleteList"></ul>
    </div>

    <div class="ranking-wrapper">
        <div class="ranking-header">
            <div class="dot"></div>
            <span>인기 검색어</span>
        </div>
        <ul class="ranking-list" id="rankingList"></ul>
    </div>
</main>

<script>
    const input = document.getElementById('searchInput');
    const list  = document.getElementById('autocompleteList');
    let activeIndex = -1;
    let currentSuggestions = [];
    let debounceTimer;

    async function renderSuggestions(query) {
        const q = query.trim();
        if (!q) { closeList(); return; }

        try {
            const res = await fetch('/search/autoCompletion?prefix=' + encodeURIComponent(q));
            currentSuggestions = await res.json();

            if (!currentSuggestions.length) { closeList(); return; }

            list.innerHTML = currentSuggestions.map((item, i) => {
                const highlighted = item.name.replace(
                    new RegExp(`(${escapeReg(q)})`, 'gi'),
                    '<em>$1</em>'
                );

                const imageEl = item.imageUrl
                    ? `<img class="brand-image" src="${item.imageUrl}" alt="${item.name}" onerror="this.style.display='none'">`
                    : `<div class="brand-image-placeholder">${item.name.charAt(0).toUpperCase()}</div>`;

                return `
                <li class="autocomplete-item" data-index="${i}" onmousedown="selectItem(${i})">
                    ${imageEl}
                    <span class="item-text">${highlighted}</span>
                    <span class="item-label">브랜드</span>
                </li>`;
            }).join('');

            activeIndex = -1;
            list.classList.add('open');
        } catch (e) {
            console.error('자동완성 오류:', e);
            closeList();
        }
    }

    function closeList() {
        list.classList.remove('open');
        list.innerHTML = '';
        activeIndex = -1;
    }

    function selectItem(index) {
        if (currentSuggestions[index]) {
            input.value = currentSuggestions[index].name;
            closeList();
            doSearch();
        }
    }

    function setActive(index) {
        const items = list.querySelectorAll('.autocomplete-item');
        items.forEach(el => el.classList.remove('active'));
        if (index >= 0 && index < items.length) {
            items[index].classList.add('active');
            activeIndex = index;
        }
    }

    function escapeReg(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    input.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => renderSuggestions(input.value), 300);
    });

    input.addEventListener('keydown', e => {
        const items = list.querySelectorAll('.autocomplete-item');
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            setActive(Math.min(activeIndex + 1, items.length - 1));
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            setActive(Math.max(activeIndex - 1, 0));
        } else if (e.key === 'Enter') {
            if (activeIndex >= 0) { selectItem(activeIndex); }
            else { doSearch(); }
        } else if (e.key === 'Escape') {
            closeList();
        }
    });

    document.addEventListener('click', e => {
        if (!e.target.closest('.search-wrapper')) closeList();
    });

    function doSearch() {
        const q = input.value.trim();
        if (!q) return;
        window.location.href = '/search/result?keyword=' + encodeURIComponent(q);
    }

    async function loadRanking() {
        try {
            const res = await fetch('/search/ranking');
            const data = await res.json();

            const rankingList = document.getElementById('rankingList');
            rankingList.innerHTML = data.map((item, i) => `
                <li class="ranking-item" onclick="searchByRanking('${item.brandName}')">
                    <span class="rank-num">${i + 1}</span>
                    <span class="rank-name">${item.brandName}</span>
                    ${item.rankNew === 'New'
                ? `<span class="rank-new">NEW</span>`
                : `<span class="rank-dash">-</span>`
            }
                </li>
            `).join('');
        } catch (e) {
            console.error('랭킹 오류:', e);
        }
    }

    function searchByRanking(keyword) {
        input.value = keyword;
        doSearch();
    }

    loadRanking();
    setInterval(loadRanking, 60000);
</script>
</body>
</html>
