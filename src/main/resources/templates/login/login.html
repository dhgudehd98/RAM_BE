<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - RAM</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --black: #0e0e0e;
            --white: #f8f7f4;
            --accent: #e8432d;
            --muted: #888;
            --border: #e0ddd8;
            --surface: #ffffff;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--white);
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .left-panel {
            background: var(--black);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 48px;
            position: relative;
            overflow: hidden;
        }

        .left-panel::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(232,67,45,0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        .left-panel::after {
            content: '';
            position: absolute;
            bottom: -80px;
            left: -80px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(232,67,45,0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        .brand {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 36px;
            letter-spacing: 4px;
            color: var(--white);
            text-decoration: none;
        }

        .brand span { color: var(--accent); }
        .left-content { z-index: 1; }

        .left-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(52px, 6vw, 80px);
            line-height: 0.95;
            letter-spacing: 2px;
            color: var(--white);
            margin-bottom: 24px;
        }

        .left-title span { color: var(--accent); display: block; }

        .left-desc {
            font-size: 14px;
            color: #666;
            line-height: 1.7;
            max-width: 320px;
        }

        .left-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 32px;
        }

        .tag {
            padding: 6px 14px;
            border: 1px solid #2a2a2a;
            border-radius: 20px;
            font-size: 11px;
            color: #555;
            letter-spacing: 0.5px;
        }

        .left-bottom { font-size: 12px; color: #333; z-index: 1; }

        .right-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px;
            background: var(--white);
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            animation: fadeUp 0.5s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header { margin-bottom: 40px; }

        .login-header h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 40px;
            letter-spacing: 2px;
            color: var(--black);
            margin-bottom: 8px;
        }

        .login-header p { font-size: 14px; color: var(--muted); }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-error { background: #fff0ee; border: 1px solid #ffd0c8; color: var(--accent); }
        .alert-success { background: #f0fff4; border: 1px solid #c8ffd0; color: #2e7d32; }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--black);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            color: var(--black);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--black);
            box-shadow: 0 0 0 3px rgba(14,14,14,0.06);
        }

        input::placeholder { color: #bbb; }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: var(--black);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'DM Sans', sans-serif;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 8px;
        }

        .btn-login:hover { background: #222; }
        .btn-login:active { transform: scale(0.99); }
        .btn-login:disabled { background: #aaa; cursor: not-allowed; }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            font-size: 12px;
            color: var(--muted);
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .join-link { text-align: center; font-size: 13px; color: var(--muted); }

        .join-link a {
            color: var(--black);
            font-weight: 500;
            text-decoration: none;
            border-bottom: 1px solid var(--black);
            padding-bottom: 1px;
            transition: color 0.2s;
        }

        .join-link a:hover { color: var(--accent); border-color: var(--accent); }

        @media (max-width: 768px) {
            body { grid-template-columns: 1fr; }
            .left-panel { display: none; }
            .right-panel { padding: 32px 24px; }
        }
    </style>
</head>
<body>

<!-- LEFT PANEL -->
<div class="left-panel">
    <a href="/" class="brand">RAM<span>.</span></a>
    <div class="left-content">
        <h1 class="left-title">
            RESALE
            <span>AUCTION</span>
            MARKET
        </h1>
        <p class="left-desc">
            희귀 아이템부터 한정판 스니커즈까지.<br>
            경매로 더 합리적인 가격에 거래하세요.
        </p>
        <div class="left-tags">
            <span class="tag">SNEAKERS</span>
            <span class="tag">STREETWEAR</span>
            <span class="tag">LIMITED</span>
            <span class="tag">AUCTION</span>
        </div>
    </div>
    <div class="left-bottom">© 2026 RAM. All rights reserved.</div>
</div>

<!-- RIGHT PANEL -->
<div class="right-panel">
    <div class="login-box">

        <div class="login-header">
            <h2>SIGN IN</h2>
            <p>계정에 로그인하여 경매에 참여하세요</p>
        </div>

        <!-- 에러 메시지 (JS로 제어) -->
        <div class="alert alert-error" id="errorMsg"></div>

        <!-- JWT 방식 - form submit 대신 fetch 사용 -->
        <div class="form-group">
            <label for="email">이메일</label>
            <input type="email"
                   id="email"
                   placeholder="example@email.com"
                   required>
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password"
                   id="password"
                   placeholder="비밀번호를 입력하세요"
                   required>
        </div>

        <button class="btn-login" id="loginBtn" onclick="login()">로그인</button>

        <div class="divider">또는</div>

        <div class="join-link">
            아직 계정이 없으신가요? <a href="/login/join">회원가입</a>
        </div>

    </div>
</div>

<script>
    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const loginBtn = document.getElementById('loginBtn');

        if (!email || !password) {
            showError('이메일과 비밀번호를 입력해주세요.');
            return;
        }

        // 중복 요청 방지
        loginBtn.disabled = true;
        loginBtn.textContent = '로그인 중...';

        try {
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();

            if (data.result === 'Y') {
                // JWT 토큰 저장
                localStorage.setItem('accessToken', data.token);
                console.log("token : " + data.token);
                // 로그인 성공시 SSE 연결
                connectSSE();

                // 메인 페이지로 이동
                window.location.href = '/product/list';
            } else {
                showError(data.msg);
            }
        } catch (e) {
            showError('로그인 중 오류가 발생했습니다.');
        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = '로그인';
        }
    }

    function connectSSE() {
        const token = localStorage.getItem("accessToken");
        const eventSource = new EventSource(`/notification/subscribe?token=${token}`);

        // 연결 성공 시
        eventSource.onopen = () => {
            console.log("SSE 연결 성공!");
        };

        eventSource.addEventListener("notification", (event) => {
            console.log("notification 이벤트 수신:", event.data);
            showNotification(event.data);
        });

        // connect 이벤트도 확인
        eventSource.addEventListener("connect", (event) => {
            console.log("connect 이벤트:", event.data);
        });

        eventSource.onerror = (e) => {
            console.log("SSE 에러:", e);
            eventSource.close();
        };
    }

    function showNotification(message){
        console.log("알림 : ", message);
    }

    function showError(msg) {
        const errorMsg = document.getElementById('errorMsg');
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
    }

    // 엔터키로 로그인
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') login();
    });
</script>

</body>
</html>
